<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b00" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#ff2200" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070709" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Orange Gradient -->
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6a00" />
      <stop offset="50%" stop-color="#ff3b00" />
      <stop offset="100%" stop-color="#ff1200" />
    </linearGradient>

    <!-- Linear Core Accent -->
    <linearGradient id="glowLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8833" />
      <stop offset="100%" stop-color="#ff2200" />
    </linearGradient>

    <!-- Radial White Core Flare -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#ff6a00" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff3b00" stop-opacity="0" />
    </radialGradient>

    <!-- SVG Filters for high-res glow -->
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="starBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="starBlur" />
      <feMerge>
        <feMergeNode in="starBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep dark rounded container for dark & light browser tab contrast -->
  <rect width="64" height="64" rx="14" fill="#08080a" />

  <!-- Ambient background glow aura -->
  <circle cx="32" cy="32" r="28" fill="url(#bgGlow)" />

  <!-- Layered Outer Diamond Glow (renders even if filters disabled) -->
  <path d="M 32 7 L 57 32 L 32 57 L 7 32 Z" 
        stroke="#ff3b00" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" 
        opacity="0.25" fill="none" />
  <path d="M 32 7 L 57 32 L 32 57 L 7 32 Z" 
        stroke="#ff4400" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" 
        opacity="0.5" fill="none" />

  <!-- Sharp Main Outer Diamond -->
  <path d="M 32 7 L 57 32 L 32 57 L 7 32 Z" 
        stroke="url(#neonOrange)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" 
        fill="none" filter="url(#bloom)" />

  <!-- Horizontal Axis Lines (Glowing Orange Accents) -->
  <line x1="14" y1="32" x2="26" y2="32" 
        stroke="#ff3b00" stroke-width="6" stroke-linecap="round" opacity="0.3" />
  <line x1="14" y1="32" x2="26" y2="32" 
        stroke="url(#neonOrange)" stroke-width="3.2" stroke-linecap="round" />

  <line x1="38" y1="32" x2="50" y2="32" 
        stroke="#ff3b00" stroke-width="6" stroke-linecap="round" opacity="0.3" />
  <line x1="38" y1="32" x2="50" y2="32" 
        stroke="url(#neonOrange)" stroke-width="3.2" stroke-linecap="round" />

  <!-- Inner Curved Attention Arcs -->
  <!-- Top-Left Arc: Left to Top -->
  <path d="M 18 32 C 24 32 32 24 32 18" 
        stroke="#ff3b00" stroke-width="6" stroke-linecap="round" opacity="0.3" fill="none" />
  <path d="M 18 32 C 24 32 32 24 32 18" 
        stroke="url(#neonOrange)" stroke-width="3.2" stroke-linecap="round" fill="none" 
        filter="url(#bloom)" />

  <!-- Bottom-Right Arc: Right to Bottom -->
  <path d="M 46 32 C 40 32 32 40 32 46" 
        stroke="#ff3b00" stroke-width="6" stroke-linecap="round" opacity="0.3" fill="none" />
  <path d="M 46 32 C 40 32 32 40 32 46" 
        stroke="url(#neonOrange)" stroke-width="3.2" stroke-linecap="round" fill="none" 
        filter="url(#bloom)" />

  <!-- Center White Star Glow Halo -->
  <circle cx="32" cy="32" r="9" fill="url(#starGlow)" />

  <!-- 4-Pointed Spark / Diamond Core -->
  <path d="M 32 23 Q 32 32 41 32 Q 32 32 32 41 Q 32 32 23 32 Q 32 32 32 23 Z" 
        fill="#ffffff" filter="url(#starBloom)" />

  <!-- Intense White Diamond Center -->
  <rect x="29" y="29" width="6" height="6" transform="rotate(45 32 32)" fill="#ffffff" />
</svg>
